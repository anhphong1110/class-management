<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>

<a href="Login.dc.html" style="min-height:44px;box-sizing:border-box;padding:0 16px;border-radius:14px;background:#F6F4FF;color:#3441B5;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px">

Đăng xuất

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":null,"default":"Tổng quan"},"subtitle":{"editor":null,"default":""},"$preview":{"width":1080,"height":96}}'>

return { title: this.props.title || 'Tổng quan', subtitle: this.props.subtitle || '' };

}
