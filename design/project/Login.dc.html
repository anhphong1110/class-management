<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập – Trạm không gian Năm 8</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#1E2160;color:#231F4D}
a{text-decoration:none;color:inherit}
button,input{font-family:'Nunito',system-ui,sans-serif}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tw{animation:tw 3s ease-in-out infinite}
.fl{animation:fl 5s ease-in-out infinite}
</style>
</helmet>
<div style="min-height:860px;box-sizing:border-box;padding:24px;background:radial-gradient(circle at 20% 20%,#4B4FB5 0%,#2B2E7E 45%,#1E2160 100%);display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif;position:relative;overflow:hidden">
<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%">
<g class="tw"><circle cx="80" cy="70" r="3" fill="#FFE08A"/><circle cx="260" cy="40" r="2" fill="#fff"/><circle cx="520" cy="90" r="3" fill="#FFE08A"/><circle cx="780" cy="50" r="2" fill="#fff"/><circle cx="930" cy="140" r="3" fill="#FFE08A"/><circle cx="40" cy="330" r="2" fill="#fff"/><circle cx="960" cy="420" r="2.5" fill="#fff"/><circle cx="120" cy="540" r="3" fill="#FFE08A"/><circle cx="600" cy="570" r="2" fill="#fff"/></g>
</svg>

<div style="position:relative;flex:1 1 380px;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff">
<div style="display:flex;align-items:center;gap:12px">
<div style="position:relative;width:88px;height:88px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:#fff">
<img src="/_blob/c29022907dd1206cfc9cde75f5d232a6" alt="Logo trường Tiểu học Chính Nghĩa" style="position:absolute;left:-2px;top:-2px;width:92px;height:92px;object-fit:cover">
</div>
<div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;color:#fff">TRƯỜNG TIỂU HỌC CHÍNH NGHĨA</div>
</div>
<div style="display:flex;align-items:center;gap:12px">
<div style="font-size:14px;font-weight:800;letter-spacing:.18em;color:#FFE08A">LỚP NĂM 8 (5/8) · TEAM CÔ KHANH</div>
</div>
<div class="fl" style="width:100%;max-width:520px">
<img src="/_blob/5910f6622b2803abde4a3d501b5377dc" alt="Ba bạn học sinh chibi" style="display:block;width:100%;height:auto">
</div>
<h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:46px;line-height:1.05">Trạm không gian<br>Năm 8</h1>
<p style="margin:0;font-size:17px;color:#E4E7FF">Cùng học – Cùng chơi – Cùng tỏa sáng</p>
</div>

<div style="position:relative;flex:1 1 360px;max-width:460px;background:#fff;border-radius:32px;padding:32px 30px;box-shadow:0 30px 60px rgba(10,12,60,.45);display:flex;flex-direction:column;gap:18px">
<div>
<h2 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px">Đăng nhập</h2>
<div style="font-size:14.5px;color:#5B5890">Chọn tài khoản để vào trạm không gian</div>
</div>
<div role="tablist" style="display:flex;gap:6px;background:#F1EFFC;border-radius:16px;padding:5px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="flex:1;min-height:46px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer;background:{{t.bg}};color:{{t.color}}">{{t.label}}</button>
</sc-for>
</div>
<label style="display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14.5px;color:#4A476E">{{userLabel}}
<input type="text" placeholder="{{userHint}}" autocomplete="username" style="min-height:52px;box-sizing:border-box;border-radius:14px;border:2px solid #D9D5F2;padding:0 16px;font-size:16px;font-weight:600;color:#231F4D">
</label>
<label style="display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14.5px;color:#4A476E">Mật khẩu
<input type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" style="min-height:52px;box-sizing:border-box;border-radius:14px;border:2px solid #D9D5F2;padding:0 16px;font-size:16px;font-weight:600;color:#231F4D">
</label>
<a href="{{goHref}}" style="min-height:56px;box-sizing:border-box;border-radius:16px;background:linear-gradient(90deg,#4F5BD5,#7A58E0);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">Cất cánh</a>
<div style="font-size:13px;line-height:1.5;color:#5B5890;background:#F6F4FF;border-radius:12px;padding:10px 12px">{{note}}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { role: 'teacher' };
}
renderVals() {
const r = this.state.role;
const t = r === 'teacher';
return {
tabs: [['teacher','Giáo viên'],['student','Học sinh']].map(([k, label]) => { const on = r === k; return { label, on, pick: () => this.setState({ role: k }), bg: on ? '#4F5BD5' : 'transparent', color: on ? '#fff' : '#3A3769' }; }),
userLabel: t ? 'Tên đăng nhập của cô' : 'Tên đăng nhập của em',
userHint: t ? 'Ví dụ: co.khanh' : 'Ví dụ: hs.minhanh',
goHref: 'Main.dc.html',
note: t ? 'Tài khoản giáo viên có toàn quyền quản trị lớp học.' : 'Tài khoản học sinh do cô giáo tạo. Em chỉ xem được sao, bảng xếp hạng, quà tặng và thời khóa biểu. Bản học sinh chưa có trong thiết kế này.'
};
}
}
</script>
</body>
</html>
